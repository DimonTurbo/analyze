<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gold Signal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .box {
            width: 400px;
            max-width: 90%;
            padding: 30px;
            background: #1c1c1c;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0 15px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background: #252525;
            display: none;
        }

        .signal {
            font-size: 28px;
            font-weight: bold;
            color: #00ff88;
        }

        .info {
            margin-top: 10px;
            color: #aaa;
        }

        .error {
            color: #ff5555;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Gold Signal</h1>

    <label>Сумма золота</label>
    <input
        id="gold"
        type="number"
        placeholder="Например: 40"
    >

    <label>Время</label>
    <input
        id="time"
        type="number"
        min="0"
        max="59"
        placeholder="Например: 49"
    >

    <button onclick="getSignal()">
        Получить сигнал
    </button>

    <div id="result"></div>

</div>


<script>

function getSignal() {

    // Получаем значения из полей
    let gold = Number(document.getElementById("gold").value);
    let time = Number(document.getElementById("time").value);

    let result = document.getElementById("result");

    // Показываем блок результата
    result.style.display = "block";

    // Проверяем голд
    if (isNaN(gold)) {
        result.innerHTML = '<div class="error">Введите сумму золота</div>';
        return;
    }

    // Проверяем время
    if (isNaN(time) || time < 0 || time > 59) {
        result.innerHTML = '<div class="error">Время должно быть от 0 до 59</div>';
        return;
    }

    let plus;

    /*
        ГОЛД МЕНЬШЕ 50
    */

    if (gold < 50) {

        // Нечётная минута
        if (time % 2 === 1) {
            plus = 6;
        }

        // Чётная минута
        else {
            plus = 7;
        }
    }

    /*
        ГОЛД 50 И БОЛЬШЕ
    */

    else {

        // Нечётная минута
        if (time % 2 === 1) {
            plus = 7;
        }

        // Чётная минута
        else {
            plus = 8;
        }
    }

    // Вычисляем время сигнала
    let signalTime = time + plus;

    // Если получилось больше 59,
    // начинаем отсчёт с 0
    if (signalTime >= 60) {
        signalTime = signalTime - 60;
    }

    // Добавляем ведущий ноль
    let formattedTime = String(signalTime).padStart(2, "0");

    // Показываем результат
    result.innerHTML = `
        <div class="signal">
            ${formattedTime} минута
        </div>

        <div class="info">
            Лови золото (На хорошей линии)
        </div>
    `;
}

</script>

</body>
</html>
